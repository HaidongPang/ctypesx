[project]
name = "ctypesx"
version = "0.1.0"
description = "Typed, checked, and declarative C data records built on Python's ctypes"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/HaidongPang/ctypesx"
Repository = "https://github.com/HaidongPang/ctypesx"
Issues = "https://github.com/HaidongPang/ctypesx/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
venvPath = "."
venv = ".venv"
